<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>신입사원 1주년: Next Chapter · 일잘법 투표 결과</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--lg:#a50034;--lg-d:#7d0027;--lg-l:#fdeef3;--gold:#f5b33d;--gold-l:#fff6e0;--bg:#f7f3f5;--card:#fff;--ink:#1f2128;--sub:#7a7f8b;--line:#ebe6e8}
  *{box-sizing:border-box}
  html{font-size:clamp(15px,1.05vw,26px)}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.5}
  button,select{font:inherit}
  .hide{display:none!important}
  .app{min-height:100%;display:flex;flex-direction:column;padding:1.4rem clamp(14px,2.6vw,56px) 1.6rem;gap:1.1rem}

  /* ── 상단 배너 ── */
  .top{position:relative;overflow:hidden;color:#fff;border-radius:1.5rem;padding:1.3rem 1.8rem;display:flex;align-items:center;justify-content:space-between;gap:1.2rem;flex-wrap:wrap;
    background:radial-gradient(90% 160% at 90% -30%,#d4204f 0%,transparent 60%),linear-gradient(160deg,var(--lg),var(--lg-d))}
  .badge{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.08em;padding:.25rem .8rem;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35)}
  .top h1{margin:.35rem 0 0;font-size:2.2rem;line-height:1.15;font-weight:800;letter-spacing:-.02em}
  .top h1 em{font-style:normal;color:var(--gold)}
  .top p{margin:.2rem 0 0;font-size:1rem;opacity:.88}
  .ctl{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
  select{padding:.7rem 1rem;border:0;border-radius:1rem;font-size:1.25rem;font-weight:700;color:var(--lg);background:#fff;min-width:11rem;cursor:pointer}
  .gbtn{padding:.7rem 1.1rem;border:1.5px solid rgba(255,255,255,.55);border-radius:1rem;background:rgba(255,255,255,.12);color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
  .gbtn:hover{background:rgba(255,255,255,.22)}
  .err{color:#c62828;font-size:1rem;min-height:1.2rem}

  .chips{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
  .chip{font-size:1rem;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:99px;padding:.4rem 1rem}
  .upd{margin-left:auto;color:var(--sub);font-size:.85rem}

  /* ── 본문: 좌 순위 / 우 상세 ── */
  .stage{flex:1;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:1.2rem;align-items:start}
  .list{display:flex;flex-direction:column;gap:.7rem}
  .row{position:relative;display:grid;grid-template-columns:3.4rem minmax(0,1fr) 11rem;align-items:center;gap:1rem;background:var(--card);border:2px solid var(--line);border-radius:1.2rem;padding:1rem 1.3rem;cursor:pointer;transition:.15s}
  .row:hover{border-color:#e6b3c4;transform:translateX(2px)}
  .row.on{border-color:var(--lg);background:var(--lg-l);box-shadow:0 8px 22px rgba(165,0,52,.12)}
  .rk{font-size:1.9rem;font-weight:800;text-align:center;color:var(--sub)}
  .ti{font-size:1.55rem;font-weight:700;line-height:1.35;word-break:keep-all}
  .vt{display:flex;align-items:baseline;justify-content:flex-end;gap:.2rem}
  .vt b{font-size:2.3rem;font-weight:800;color:var(--lg);line-height:1}
  .vt small{font-size:1rem;color:var(--sub);font-weight:600}
  .bar{grid-column:1/-1;height:.55rem;border-radius:99px;background:#f1ecee;overflow:hidden;margin-top:-.2rem}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--lg));transition:width .5s}
  .row.top3 .rk{color:inherit}

  .panel{position:sticky;top:1rem;background:var(--card);border:1px solid var(--line);border-radius:1.5rem;padding:1.8rem;box-shadow:0 10px 30px rgba(165,0,52,.08);min-height:22rem}
  .empty{text-align:center;color:var(--sub);padding:3rem 1rem}
  .empty .big{font-size:3.4rem}
  .empty p{font-size:1.2rem;margin:.8rem 0 0}
  .pill{display:inline-block;font-weight:700;font-size:1rem;color:var(--lg);background:var(--lg-l);padding:.3rem .9rem;border-radius:99px}
  .panel h2{margin:.8rem 0 1.2rem;font-size:1.9rem;line-height:1.3;font-weight:800;word-break:keep-all}
  .who{display:flex;align-items:center;gap:1rem;padding:1rem 1.1rem;background:var(--gold-l);border-radius:1.1rem}
  .av{width:3.4rem;height:3.4rem;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.7rem;flex:0 0 auto}
  .who b{display:block;font-size:1.7rem;line-height:1.2}
  .who span{color:var(--sub);font-size:1.05rem}
  .org{margin:1rem .2rem 0;font-size:1.1rem;color:#4b505c}
  .go{display:block;margin-top:1.4rem;text-align:center;text-decoration:none;color:#fff;font-weight:800;font-size:1.3rem;padding:1rem;border-radius:1.1rem;background:linear-gradient(135deg,var(--lg),var(--lg-d));box-shadow:0 8px 20px rgba(165,0,52,.25)}
  .go:hover{filter:brightness(1.08)}
  .nolink{margin-top:1.4rem;text-align:center;color:var(--sub);font-size:1.05rem}

  .hint{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--sub)}
  .hint .big{font-size:4rem}
  .hint p{font-size:1.5rem;margin:.6rem 0 0}

  @media (max-width:900px){
    .stage{grid-template-columns:1fr}
    .panel{position:static;min-height:0}
    .row{grid-template-columns:2.6rem minmax(0,1fr) 7rem;padding:.9rem 1rem}
    .ti{font-size:1.2rem}.vt b{font-size:1.8rem}.top h1{font-size:1.7rem}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <span class="badge">🎂 신입사원 1주년</span>
      <h1>Next <em>Chapter</em> · 일잘법 투표 결과 🏆</h1>
      <p>이번 기회에 꼭 들어보고 싶은, 흥미로운 일잘법</p>
    </div>
    <div class="ctl">
      <select id="secSel"><option value="">분반 불러오는 중... ⏳</option></select>
      <button class="gbtn" id="refresh">🔄 새로고침</button>
      <button class="gbtn" id="fs">⛶ 전체화면</button>
    </div>
  </header>
  <div class="err" id="err"></div>

  <div id="hint" class="hint"><div><div class="big">👆</div><p>위에서 분반을 선택해 주세요</p></div></div>

  <div id="main" class="hide" style="display:contents">
    <div class="chips" id="stats"></div>
    <div class="stage">
      <div class="list" id="list"></div>
      <aside class="panel" id="panel"></aside>
    </div>
  </div>
</div>

<script>
/* ▼ Apps Script 웹 앱 배포 URL (수강생 페이지와 동일) */
const API_URL = 'https://script.google.com/macros/s/AKfycbyHfjsjGmLrLjBHIBq2-zf702VAx1OYXCd0a_trciSQuWpwr3croKphLRB5hn1A0QAb/exec';

const $ = id => document.getElementById(id);
let data = null, sel = null, timer = null;
const MEDAL = ['🥇', '🥈', '🥉'];

async function call(body) {
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return res.json();
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function safeUrl(u) { return /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : ''; }

const secLabel = s => /반$/.test(String(s)) ? s : s + '분반';
function buildSelect() {
  const cur = $('secSel').value;
  const secs = Object.keys(data.sections).sort((a, b) => a.localeCompare(b, 'ko', { numeric: true }));
  $('secSel').innerHTML = '<option value="">분반 선택 ▾</option>' + secs.map(s => `<option value="${esc(s)}">${esc(secLabel(s))}</option>`).join('');
  if (secs.includes(cur)) $('secSel').value = cur;
}
async function load() {
  const r = await call({ action: 'admin' });
  if (!r.ok) throw new Error(r.error || '불러오기 실패');
  data = r;
}
async function init() {
  try {
    await load(); buildSelect();
    let last = '';
    try { last = localStorage.getItem('voteSection') || ''; } catch (e) {}
    if (last && data.sections[last]) $('secSel').value = last;
    choose();
    timer = setInterval(refresh, 30000);
  } catch (e) {
    $('secSel').innerHTML = '<option value="">불러오기 실패</option>';
    $('err').textContent = e.message || '서버에 연결할 수 없습니다.';
  }
}
function choose() {
  const sec = $('secSel').value;
  $('err').textContent = ''; sel = null;
  $('hint').classList.toggle('hide', !!sec);
  $('main').classList.toggle('hide', !sec);
  if (!sec) return;
  try { localStorage.setItem('voteSection', sec); } catch (e) {}
  render();
}
async function refresh() {
  try { await load(); buildSelect(); if ($('secSel').value) render(); $('err').textContent = ''; }
  catch (e) { $('err').textContent = '갱신에 실패했어요. 잠시 후 다시 시도해 주세요.'; }
}

function render() {
  const sec = $('secSel').value;
  const items = data.items.filter(i => i.section === sec)
    .sort((a, b) => b.votes - a.votes || a.title.localeCompare(b.title, 'ko'));
  const max = Math.max(1, ...items.map(i => i.votes));
  let pos = 0, prev = null, idx = 0;
  const ranked = items.map(i => { idx++; if (i.votes !== prev) { pos = idx; prev = i.votes; } return Object.assign({}, i, { pos: pos }); });

  $('list').innerHTML = ranked.map(i => {
    const medal = i.votes > 0 && i.pos <= 3 ? MEDAL[i.pos - 1] : i.pos;
    return `<div class="row${i.id === sel ? ' on' : ''}" data-k="${esc(i.id)}">
      <div class="rk">${medal}</div><div class="ti">${esc(i.title)}</div>
      <div class="vt"><b>${i.votes}</b><small>표</small></div>
      <div class="bar"><i style="width:${(i.votes / max * 100).toFixed(1)}%"></i></div></div>`;
  }).join('') || '<div class="empty"><div class="big">🫥</div><p>등록된 과제가 없어요</p></div>';

  const s = ranked.find(i => i.id === sel);
  if (s) {
    const url = safeUrl(s.link);
    const medal = s.votes > 0 && s.pos <= 3 ? MEDAL[s.pos - 1] + ' ' : '';
    $('panel').innerHTML = `
      <span class="pill">${medal}${s.pos}위 · ${s.votes}표</span>
      <h2>${esc(s.title)}</h2>
      <div class="who"><div class="av">👤</div><div><b>${esc(s.name)}</b><span>${esc(s.rank)}</span></div></div>
      <div class="org">🏢 ${esc(s.hq)}${s.dept ? ' / ' + esc(s.dept) : ''}</div>
      ${url ? `<a class="go" href="${esc(url)}" target="_blank" rel="noopener noreferrer">🔗 과제 보기</a>` : '<div class="nolink">🔗 등록된 링크가 없어요</div>'}`;
  } else {
    $('panel').innerHTML = '<div class="empty"><div class="big">👈</div><p>과제를 클릭하면<br>제출자와 과제 링크가 보여요</p></div>';
  }

  const v = data.sections[sec] || { total: 0, voted: 0 };
  const total = items.reduce((n, i) => n + i.votes, 0);
  $('stats').innerHTML = `<span class="chip">🙋 투표 참여 ${v.voted}/${v.total}명</span><span class="chip">🗳️ 총 ${total}표</span>` +
    (data.open ? '' : '<span class="chip">⏰ 투표 마감</span>') +
    `<span class="upd">갱신 ${new Date(data.updated).toLocaleTimeString('ko-KR')}</span>`;
}

$('list').onclick = e => {
  const r = e.target.closest('.row'); if (!r) return;
  sel = sel === r.dataset.k ? null : r.dataset.k; render();
};
$('secSel').onchange = choose;
$('refresh').onclick = refresh;
$('fs').onclick = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); };
document.addEventListener('fullscreenchange', () => { $('fs').textContent = document.fullscreenElement ? '⤢ 전체화면 종료' : '⛶ 전체화면'; });
if (!document.documentElement.requestFullscreen) $('fs').classList.add('hide');
init();
</script>
</body>
</html>
