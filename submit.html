<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>과제 투표</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--ink:#1b1e24;--sub:#6b7280;--line:#e3e6eb;--pri:#a50034;--pri-d:#82002a;--sel:#fdf0f4}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 110px}
  h1{font-size:22px;margin:8px 0 4px}
  .desc{color:var(--sub);font-size:14px;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
  input[type=text]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px}
  button{font:inherit;cursor:pointer}
  .btn{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-size:16px;font-weight:600}
  .btn:hover{background:var(--pri-d)} .btn:disabled{background:#c9ccd3;cursor:not-allowed}
  .err{color:#c62828;font-size:14px;margin-top:12px;min-height:20px}
  .item{display:flex;gap:12px;align-items:flex-start;padding:14px;margin-bottom:10px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;cursor:pointer;user-select:none}
  .item.on{border-color:var(--pri);background:var(--sel)}
  .box{flex:0 0 22px;height:22px;border:2px solid #b8bdc7;border-radius:6px;margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
  .item.on .box{background:var(--pri);border-color:var(--pri)}
  .title{font-size:16px;word-break:keep-all}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .cnt{font-weight:700;white-space:nowrap} .cnt b{color:var(--pri)}
  .bar .btn{margin:0}
  .center{text-align:center;padding:36px 12px}
  .big{font-size:44px}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>과제 투표</h1>
  <p class="desc" id="desc">사번과 이름을 입력하고 본인 분반의 과제에 투표해 주세요.</p>

  <!-- 1. 로그인 -->
  <div id="login" class="card">
    <label for="emp">사번</label>
    <input type="text" id="emp" autocomplete="off" inputmode="text">
    <label for="nm">이름</label>
    <input type="text" id="nm" autocomplete="off">
    <button class="btn" id="loginBtn">확인</button>
    <div class="err" id="loginErr"></div>
  </div>

  <!-- 2. 투표 -->
  <div id="vote" class="hide">
    <p class="desc" id="voteInfo"></p>
    <div id="list"></div>
    <div class="bar"><div class="bar-in">
      <div class="cnt"><b id="n">0</b> / <span id="max">3</span></div>
      <button class="btn" id="submitBtn" disabled>투표하기</button>
    </div></div>
    <div class="err" id="voteErr"></div>
  </div>

  <!-- 3. 완료/안내 -->
  <div id="done" class="card center hide">
    <div class="big" id="doneIcon">✅</div>
    <h2 id="doneTitle" style="margin:8px 0"></h2>
    <p class="desc" id="doneMsg"></p>
  </div>
</div>

<script>
/* ▼ Apps Script 웹 앱 배포 URL을 여기에 붙여넣으세요 */
const API_URL = 'https://script.google.com/macros/s/AKfycbyHfjsjGmLrLjBHIBq2-zf702VAx1OYXCd0a_trciSQuWpwr3croKphLRB5hn1A0QAb/exec';

const $ = id => document.getElementById(id);
let me = { empNo: '', name: '' }, MAX = 3, picked = new Set();

async function api(body) {
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return res.json();
}
function show(id) { ['login', 'vote', 'done'].forEach(x => $(x).classList.toggle('hide', x !== id)); window.scrollTo(0, 0); }
function done(icon, title, msg) { $('doneIcon').textContent = icon; $('doneTitle').textContent = title; $('doneMsg').textContent = msg; $('desc').classList.add('hide'); show('done'); }

$('loginBtn').onclick = async () => {
  const empNo = $('emp').value.trim(), name = $('nm').value.trim();
  if (!empNo || !name) { $('loginErr').textContent = '사번과 이름을 모두 입력해 주세요.'; return; }
  $('loginBtn').disabled = true; $('loginBtn').textContent = '확인 중...'; $('loginErr').textContent = '';
  try {
    const r = await api({ action: 'login', empNo, name });
    if (!r.ok) { $('loginErr').textContent = r.error; return; }
    me = { empNo, name }; MAX = r.max;
    if (r.voted) return done('✅', '이미 투표를 완료하셨습니다', '참여해 주셔서 감사합니다.');
    if (!r.open) return done('⏰', '투표가 마감되었습니다', '참여해 주셔서 감사합니다.');
    if (!r.items.length) return done('ℹ️', '투표할 과제가 없습니다', '운영 담당자에게 문의해 주세요.');
    render(r);
  } catch (e) {
    $('loginErr').textContent = '서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.';
  } finally { $('loginBtn').disabled = false; $('loginBtn').textContent = '확인'; }
};
['emp', 'nm'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); }));

function render(r) {
  $('desc').classList.add('hide');
  $('voteInfo').textContent = `${r.name}님 (${r.section}분반) · 제목만 보고 가장 흥미로운 과제를 최대 ${MAX}개 선택해 주세요.`;
  $('max').textContent = MAX;
  const list = $('list'); list.innerHTML = '';
  r.items.forEach(it => {
    const d = document.createElement('div'); d.className = 'item';
    const b = document.createElement('div'); b.className = 'box';
    const t = document.createElement('div'); t.className = 'title'; t.textContent = it.title;
    d.append(b, t);
    d.onclick = () => {
      if (picked.has(it.id)) { picked.delete(it.id); d.classList.remove('on'); b.textContent = ''; }
      else if (picked.size >= MAX) { $('voteErr').textContent = `최대 ${MAX}개까지 선택할 수 있습니다.`; return; }
      else { picked.add(it.id); d.classList.add('on'); b.textContent = '✓'; }
      $('voteErr').textContent = ''; $('n').textContent = picked.size; $('submitBtn').disabled = picked.size === 0;
    };
    list.appendChild(d);
  });
  show('vote');
}

$('submitBtn').onclick = async () => {
  if (!confirm(`${picked.size}개 과제에 투표합니다.\n제출 후에는 수정할 수 없습니다. 진행할까요?`)) return;
  $('submitBtn').disabled = true; $('submitBtn').textContent = '제출 중...';
  try {
    const r = await api({ action: 'vote', empNo: me.empNo, name: me.name, ids: [...picked] });
    if (r.ok) done('🎉', '투표가 완료되었습니다', '참여해 주셔서 감사합니다.');
    else { $('voteErr').textContent = r.error; $('submitBtn').disabled = false; }
  } catch (e) {
    $('voteErr').textContent = '제출에 실패했습니다. 잠시 후 다시 시도해 주세요.'; $('submitBtn').disabled = false;
  } finally { $('submitBtn').textContent = '투표하기'; }
};
</script>
</body>
</html>
